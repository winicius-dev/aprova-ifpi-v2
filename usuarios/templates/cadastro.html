{% load static %}

<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AprovaIFPI - Cadastro</title>
    <link rel="stylesheet" href="{% static 'styles/style.css' %}">
    <link rel="stylesheet" href="{% static 'styles/login.css' %}">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
</head>

<body style="margin:0; padding:0; width:100%; height:100%;">


<main class="w-100 h-100">

    <div class="container-fluid h-100">

        <div class="row vh-100">

            <!-- LADO DA LOGO -->
            <div class="col-lg-6 d-none d-lg-flex justify-content-center align-items-center position-relative"
                id="colLogo">

                <img src="{% static 'img/logo_aprovaifpi.svg' %}"
                    alt="AprovaIFPI Logo"
                    class="img-fluid img-logo" />

                <img src="{% static 'img/logo_background.svg' %}"
                    alt="logo background"
                    class="img-background position-absolute" />

                <img src="{% static 'img/line_background.svg' %}"
                    alt="line background 1"
                    class="line-background position-absolute"
                    id="lineBackground1" />

            </div>


            <!-- LADO DO FORMULÁRIO -->
            <div class="col-12 col-lg-6" id="colForm">

                <div class="form-container form-cadastro">

                    <img src="{% static 'img/full_logo.png' %}"
                        alt="logo completa"
                        class="full-logo img-fluid" />

                    <div class="d-flex mb-1">
                        <h4 class="fw-light">Crie sua&nbsp;</h4>
                        <h4 class="fw-bolder">conta</h4>
                    </div>

                    {% if messages %}
                    <div class="w-100 mb-2">
                        {% for message in messages %}
                        <div class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %} d-flex align-items-center py-2 px-3 mb-2" role="alert">
                            <i class="bi bi-exclamation-circle-fill me-2 flex-shrink-0"></i>
                            <div>{{ message }}</div>
                        </div>
                        {% endfor %}
                    </div>
                    {% endif %}

                    <form action="{% url 'cadastro' %}" method="POST" novalidate>
                        {% csrf_token %}

                        <div class="form-group mb-2">
                            <label class="form-label mb-1">Nome completo</label>
                            <input type="text"
                                name="nome"
                                value="{{ nome|default:'' }}"
                                class="form-control"
                                required />
                        </div>

                        <div class="form-group mb-2">
                            <label class="form-label mb-1">Email</label>
                            <input type="email"
                                name="email"
                                value="{{ email|default:'' }}"
                                class="form-control"
                                required />
                        </div>

                        <div class="form-group mb-2">
                            <label class="form-label mb-1">Escola</label>
                            <select name="escola" class="form-control" required>
                                <option value="">Selecione sua escola</option>
                                {% for escola in escolas %}
                                <option value="{{ escola.id }}" {% if escola_id and escola_id|stringformat:"s" == escola.id|stringformat:"s" %}selected{% endif %}>
                                    {{ escola.nome }} - {{ escola.cidade }}/{{ escola.estado }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="form-group mb-2">
                            <label class="form-label mb-1">Senha</label>
                            <input type="password"
                                name="senha"
                                class="form-control"
                                required />
                        </div>

                        <div class="form-group mb-2">
                            <label class="form-label mb-1">Confirmar senha</label>
                            <input type="password"
                                name="confirmar_senha"
                                class="form-control"
                                required />
                        </div>

                        <button type="submit"
                            class="btn-login">
                            Cadastrar
                        </button>

                        <p class="mt-2 text-sm text-center">
                            Já possui uma conta?&nbsp;
                            <a href="{% url 'login' %}"
                                class="form-link">
                                Entre aqui!
                            </a>
                        </p>
                    </form>
                </div>
            </div>

        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
